<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Note | Michael Levy</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Leave a message (Val.Town)">
    
    <link rel="stylesheet" type="text/css" href="/src/styles/style.css">
    <link rel="stylesheet" type="text/css" href="/src/styles/fonts.css">
    <link rel="stylesheet" type="text/css" href="/lab/lab.css">
    <link rel="icon" href="/resources/favicon.png">
    <link rel="stylesheet" type="text/css" href="note.css">
<script src="note.js"></script>
<script src="/src/js/utility.js"></script>
<script src="/src/js/load.js"></script>

</head>

<body onload="get()">
    <div id="escape">
        <picture><source type="image/webp" srcset="/img/s6vIfmt8cT-10.webp 10w"><img class="back-arrow" src="/img/s6vIfmt8cT-10.jpeg" width="10" height="9" alt="back arrow"></picture>
        <a href="/lab">Escape</a>
    </div>
    <main>
        <div class="container">
    <div class="note previous">
        <h1>Previous message:</h1>
        <p>From: </p>
        <p class="response" id="previous-name"></p>
        <p>Message:</p>
        <p class="response" id="previous-note"></p>
    </div>
    <div class="note new">
        <h1>Note</h1>
        <p>Leave a note for the next person who visits</p>
        <p>From:</p>
        <input id="name" type="text" size="10" maxlength="50">
        <p>Message:</p>
        <textarea id="note" maxlength="255"></textarea>
        <button id="submit" class="button" onclick="submit()">Submit</button>
    </div>
</div>

    </main>
</body>
</html>
