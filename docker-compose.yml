services:
  website:
    build:
      context: .
      args:
        - SKIP_API=${SKIP_API:-false}
    container_name: michaelevy-website
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - album_images:/usr/share/nginx/html/public/resources
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web

  backend:
    build: ./backend
    container_name: michaelevy-backend
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GIN_MODE=${GIN_MODE:-release}
      - PORT=${PORT:-8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CONTENTFUL_SPACE_ID=${CONTENTFUL_SPACE_ID}
      - CONTENTFUL_ACCESS_TOKEN=${CONTENTFUL_ACCESS_TOKEN}
    volumes:
      - album_images:/app/uploads/resources
    depends_on:
      - db
    networks:
      - web

  db:
    image: postgres:16-alpine
    container_name: michaelevy-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
         - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  postgres_data:
  album_images:
