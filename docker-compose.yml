services:
  website:
    build: .
    container_name: michaelevy-website
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - web

  backend:
    build: ./backend
    container_name: michaelevy-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GIN_MODE=${GIN_MODE:-release}
      - PORT=${PORT:-8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    depends_on:
      - db
    networks:
      - web

  db:
    image: postgres:16-alpine
    container_name: michaelevy-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  postgres_data:
