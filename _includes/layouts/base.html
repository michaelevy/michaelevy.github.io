<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />
    <link rel="stylesheet" type="text/css" href="/src/styles/style.css" />
    <link rel="stylesheet" type="text/css" href="/src/styles/index.css" />
    <script src="/src/js/magicbutton.js"/></script>
    {% if css %}
        {% for file in css %}
            <link rel="stylesheet" type="text/css" href="{{ file }}" />
        {% endfor %}
    {% endif %}
    {% if accent or secondary %}
    <style>
        main, #page-heading {
            {% if accent == 'orange' %}--accent: var(--orange);--accent-light: var(--orange-light);{% endif %}
            {% if accent == 'blue' %}--accent: var(--blue);--accent-light: var(--blue-light);{% endif %}
            {% if accent == 'black' %}--accent: var(--grey-dark);--accent-light: var(--grey-dark);{% endif %}
            {% if secondary == 'orange' %}--secondary: var(--orange);--secondary-light: var(--orange-light);{% endif %}
            {% if secondary == 'blue' %}--secondary: var(--blue);--secondary-light: var(--blue-light);{% endif %}
            {% if secondary == 'black' %}--secondary: var(--grey-dark);--secondary-light: var(--grey-dark);{% endif %}
        }
    </style>
    {% endif %}
    <link rel="icon" href="/resources/favicon.png">
    <link rel="webmention" href="https://webmention.io/michaelevy.com/webmention" />
</head>

<body>
    <nav class="animated-links">
        <div class = "flex-row width-full center-aligned" id="me-link">
            <img id="square" src="/resources/rect2.svg" width="20" height="20" alt="An orange square"></img>
            <a href = "/"><h1 class="mondia-thin accent">Michael Levy</h1></a>
        </div>
        <div class="nav-links flex-row width-full mondia-thin">
            <a href="/">Home</a>
            <img src="/resources/circle.svg" class="svg" alt="Decorative circle"></img>
            <a href="/works/">Works</a>
            <img src="/resources/circle.svg" class="svg" alt="Decorative circle"></img>
            <a href="/lab/">Lab</a>
            <img src="/resources/circle.svg" class="svg" alt="Decorative circle"></img>
            <a href="/music/">Music</a>
            <img src="/resources/circle.svg" class="svg" alt="Decorative circle"></img>
            <a href="/about/">About</a>
            <img src="/resources/circle.svg" class="svg" alt="Decorative circle"></img>
            <a href="/links/">Links</a>
            <img src="/resources/circle.svg" class="svg" alt="Decorative circle"></img>
            <a href="/splash/">Splash</a>
        </div>
    </nav>
    {%if heading %}
        <div id="page-heading"><h1 class="bar accent">{{heading}}</h1></div>
    {% endif %}

    {{ content }}
    <footer>
        <div class="flex-column">
            <div class="footer-list"><p><a href="michaelevy.com" rel="me">michaelevy.com</a> personal website © 2025</p></div>
            <div class="footer-list"><p><a href="https://bsky.app/profile/michaelevy.com" rel="me">BlueSky</a> | <a href="mailto:michaelfeehanlevy@gmail.com" rel="me">Email</a> | <a href="https://github.com/michaelevy" rel="me">GitHub</a></p></div>
            <div class="footer-list"><p>Powered by <a href="https://www.11ty.dev/">Eleventy</a></div>
        </div>
    </footer>
</body>

</html>
